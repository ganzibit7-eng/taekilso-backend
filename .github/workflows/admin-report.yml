name: Verify administrator report
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/*.test.cjs
      - run: node --check api/admin-report.js
      - run: node --check api/ai-chat.js
